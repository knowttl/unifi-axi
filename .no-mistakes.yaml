agent: codex
agent_args_override:
  codex:
    - -m
    - gpt-6.1-sol
    - -c
    - model_reasoning_effort="medium"
no_ci: true
commands:
  prepare: pnpm install --offline --frozen-lockfile
  test: >-
    pnpm check &&
    if [ -n "$UNIFI_AXI_ARTIUM_HOST" ]; then
      pnpm verify:artium --host "$UNIFI_AXI_ARTIUM_HOST" --output "$UNIFI_AXI_ARTIUM_OUTPUT";
    else
      printf '%s\n' 'SKIP Artium journeys: opt in with UNIFI_AXI_ARTIUM_HOST and UNIFI_AXI_ARTIUM_OUTPUT (frozen fixture required).';
    fi
  lint: pnpm lint
review:
  path_instructions:
    - path: "**"
      instructions: |
        Test quality: apply the "Test quality" rules in CONTRIBUTING.md to every added or changed test. Flag each violation as a finding naming the rule number, the test file:line and the evidence. Respect the listed exemptions. Never ask for a test to be written first or only to raise coverage.
